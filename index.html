<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>考公工作台</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
</head>
<body>
<div id="app">
<!-- 左侧导航栏 -->
<nav id="sidebar">
<div class="logo">
<div class="logo-icon">📚</div>
<div class="logo-text">考公工作台</div>
</div>
<div class="nav-group">
<div class="nav-group-title">倒计时</div>
</div>
<div class="nav-group">
<div class="nav-group-title">主功能</div>
<div class="nav-item active" data-page="home" data-icon="🏠">首页总览</div>
</div>
<div class="nav-group">
<div class="nav-group-title">📝 行测模块</div>
<div class="nav-item" data-page="yanyu" data-icon="🗣️">言语理解</div>
<div class="nav-item" data-page="luoji" data-icon="🧩">逻辑判断</div>
<div class="nav-item" data-page="shuliang" data-icon="🔢">数量关系</div>
<div class="nav-item" data-page="ziliao" data-icon="📊">资料分析</div>
</div>
<div class="nav-group">
<div class="nav-group-title">📖 综合模块</div>
<div class="nav-item" data-page="zhengzhi" data-icon="🏛️">政治理论</div>
<div class="nav-item" data-page="changshi" data-icon="🌍">常识判断</div>
<div class="nav-item" data-page="shenlun" data-icon="✍️">申论</div>
<div class="nav-item" data-page="zonghe" data-icon="🔗">综合运用</div>
</div>
<div class="nav-group">
<div class="nav-group-title">🛠️ 学习工具</div>
<div class="nav-item" data-page="plan" data-icon="📋">今日计划</div>
<div class="nav-item" data-page="calendar" data-icon="📅">打卡日历</div>
<div class="nav-item" data-page="wrong" data-icon="❌">错题本</div>
<div class="nav-item" data-page="stats" data-icon="📈">学习统计</div>
</div>
</nav>

<!-- 主内容区 -->
<main id="content">
<!-- 首页总览 -->
<div class="page active" id="page-home">
<div class="desktop-header">
<div class="desktop-time" id="desktopTime"></div>
<div class="desktop-date" id="desktopDate"></div>
<div class="checkin-btn" id="desktopCheckin">📍 每日打卡</div>
<div class="daily-quote" id="dailyQuote"></div>
</div>
<div class="countdown-banner" id="countdownBanner"></div>
<div class="module-grid">
<div class="module-card" data-target="yanyu">
<span class="card-icon">🗣️</span>
<h3>言语理解</h3>
<p id="progress-yanyu">今日进度 0%</p>
</div>
<div class="module-card" data-target="luoji">
<span class="card-icon">🧩</span>
<h3>逻辑判断</h3>
<p id="progress-luoji">今日进度 0%</p>
</div>
<div class="module-card" data-target="shuliang">
<span class="card-icon">🔢</span>
<h3>数量关系</h3>
<p id="progress-shuliang">今日进度 0%</p>
</div>
<div class="module-card" data-target="ziliao">
<span class="card-icon">📊</span>
<h3>资料分析</h3>
<p id="progress-ziliao">今日进度 0%</p>
</div>
<div class="module-card" data-target="zhengzhi">
<span class="card-icon">🏛️</span>
<h3>政治理论</h3>
<p id="progress-zhengzhi">今日进度 0%</p>
</div>
<div class="module-card" data-target="changshi">
<span class="card-icon">🌍</span>
<h3>常识判断</h3>
<p id="progress-changshi">今日进度 0%</p>
</div>
<div class="module-card" data-target="shenlun">
<span class="card-icon">✍️</span>
<h3>申论</h3>
<p id="progress-shenlun">今日进度 0%</p>
</div>
<div class="module-card" data-target="plan">
<span class="card-icon">📋</span>
<h3>今日计划</h3>
<p>查看计划</p>
</div>
</div>
</div>

<!-- 通用模块页面模板 -->
<div class="page" id="page-yanyu"></div>
<div class="page" id="page-luoji"></div>
<div class="page" id="page-shuliang"></div>
<div class="page" id="page-ziliao"></div>
<div class="page" id="page-zhengzhi"></div>
<div class="page" id="page-changshi"></div>
<div class="page" id="page-shenlun"></div>
<div class="page" id="page-zonghe"></div>
<div class="page" id="page-plan"></div>
<div class="page" id="page-calendar"></div>
<div class="page" id="page-wrong"></div>
<div class="page" id="page-stats"></div>
</main>
</div>

<!-- 番茄钟弹窗 -->
<div class="modal-overlay" id="pomodoroModal">
<div class="modal-content pomodoro-modal">
<button class="modal-close" onclick="closePomodoro()">✕</button>
<div class="pomodoro-circle">
<svg viewBox="0 0 200 200" class="progress-ring">
<circle cx="100" cy="100" r="85" class="ring-bg"/>
<circle cx="100" cy="100" r="85" class="ring-progress" id="ringProgress"/>
</svg>
<div class="timer-display" id="timerDisplay">25:00</div>
</div>
<div class="pomodoro-controls">
<button class="btn-primary" id="timerStart">开始</button>
<button class="btn-secondary" id="timerReset">重置</button>
</div>
<div class="pomodoro-stats">
<span>今日完成: <strong id="todayPomos">0</strong> 个番茄</span>
</div>
</div>
</div>

<!-- 题库弹窗 -->
<div class="modal-overlay" id="quizModal">
<div class="modal-content quiz-modal">
<button class="modal-close" onclick="closeQuiz()">✕</button>
<div class="quiz-container" id="quizContainer"></div>
</div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
