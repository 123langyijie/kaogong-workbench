name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Publish APK to repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_PATH=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          echo "Publishing: $APK_PATH"
          gh api --method PUT "/repos/${{ github.repository }}/contents/dist/kaogong-workbench.apk" \
            -f message="chore: publish APK" \
            -f content="$(base64 -w0 "$APK_PATH")" \
            -f branch="${{ github.ref_name }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kaogong-workbench-apk
          path: app/build/outputs/apk/debug/*.apk
