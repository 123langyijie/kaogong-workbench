name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Publish APK to repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          APK_PATH=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          echo "Publishing: $APK_PATH"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git checkout --orphan dist
          git rm -rf . || true
          mkdir -p dist
          cp "$APK_PATH" dist/kaogong-workbench.apk
          git add dist/kaogong-workbench.apk
          git commit -m "chore: publish APK"
          git push origin dist --force

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kaogong-workbench-apk
          path: app/build/outputs/apk/debug/*.apk
